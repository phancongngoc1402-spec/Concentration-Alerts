name: reproducibility-smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate deterministic manuscript results
        run: python validate_key_results.py --input Dataset.xlsx

      - name: Smoke-run analysis pipeline
        run: >-
          python run_all.py
          --input Dataset.xlsx
          --output outputs_smoke
          --bootstrap 50
          --secondary-bootstrap 20
          --skip-secondary
          --skip-figures
